<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#5BB8F5"/>
      <stop offset="100%" stop-color="#3A9FE0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="36" cy="36" r="33"/>
    </clipPath>
  </defs>

  <!-- Circle background: sky blue -->
  <circle cx="36" cy="36" r="33" fill="url(#skyGrad)"/>

  <!-- Sun body -->
  <circle cx="30" cy="28" r="11" fill="#F5A623" clip-path="url(#circleClip)"/>
  <circle cx="30" cy="28" r="8" fill="#FFD000" clip-path="url(#circleClip)"/>

  <!-- Sun rays -->
  <line x1="30" y1="11" x2="30" y2="16" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" clip-path="url(#circleClip)"/>
  <line x1="42" y1="14" x2="39" y2="18" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" clip-path="url(#circleClip)"/>
  <line x1="18" y1="14" x2="21" y2="18" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" clip-path="url(#circleClip)"/>
  <line x1="48" y1="24" x2="43" y2="25.5" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" clip-path="url(#circleClip)"/>
  <line x1="12" y1="24" x2="17" y2="25.5" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round" clip-path="url(#circleClip)"/>

  <!-- Waves (orange/yellow) at bottom -->
  <path d="M4 48 Q11 43 18 48 Q25 53 32 48 Q39 43 46 48 Q53 53 60 48 Q67 43 68 46" stroke="#F5A623" stroke-width="3" fill="none" stroke-linecap="round" clip-path="url(#circleClip)"/>
  <path d="M4 57 Q11 52 18 57 Q25 62 32 57 Q39 52 46 57 Q53 62 60 57 Q67 52 68 55" stroke="#F5A623" stroke-width="2.5" fill="none" stroke-linecap="round" clip-path="url(#circleClip)"/>
  <path d="M4 65 Q11 60 18 65 Q25 70 32 65 Q39 60 46 65 Q53 70 60 65" stroke="#FFD000" stroke-width="2" fill="none" stroke-linecap="round" clip-path="url(#circleClip)"/>

  <!-- Circle border -->
  <circle cx="36" cy="36" r="33" stroke="#3A9FE0" stroke-width="1.5" fill="none"/>

  <!-- 평안교회 text (large, bold, dark navy) -->
  <text x="82" y="43" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="900" font-size="30" fill="#1B3A6B" letter-spacing="-0.5">평안교회</text>

  <!-- PEACE CHURCH text (smaller, medium blue, same line right-aligned) -->
  <text x="86" y="58" font-family="'Arial','Helvetica',sans-serif" font-weight="600" font-size="11" fill="#3A7FCC" letter-spacing="3">PEACE CHURCH</text>
</svg>
