<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="28" cy="28" r="26"/>
    </clipPath>
  </defs>

  <!-- Circle background: top orange, bottom blue -->
  <circle cx="28" cy="28" r="26" fill="#F57C00"/>
  <rect x="2" y="28" width="52" height="26" fill="#1565C0" clip-path="url(#circleClip)"/>

  <!-- Sun rays (top) -->
  <line x1="28" y1="5" x2="28" y2="12" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="8" x2="37" y2="14" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="8" x2="19" y2="14" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="46" y1="16" x2="40" y2="19" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="16" x2="16" y2="19" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Sun circle -->
  <circle cx="28" cy="22" r="7" fill="#FFF176" opacity="0.9"/>
  <circle cx="28" cy="22" r="5" fill="#FFD600"/>

  <!-- Horizontal divider (white band) -->
  <rect x="2" y="26.5" width="52" height="3" fill="white" clip-path="url(#circleClip)"/>

  <!-- Waves (bottom) -->
  <path d="M4 32 Q10 29 16 32 Q22 35 28 32 Q34 29 40 32 Q46 35 52 32" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M4 38 Q10 35 16 38 Q22 41 28 38 Q34 35 40 38 Q46 41 52 38" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Circle border -->
  <circle cx="28" cy="28" r="26" stroke="white" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- 평안교회 text -->
  <text x="64" y="30" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" font-size="22" fill="#1a3565" letter-spacing="-1">평안교회</text>

  <!-- PEACE / CHURCH stacked -->
  <text x="65" y="43" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="9.5" fill="#1565C0" letter-spacing="3.5">PEACE CHURCH</text>
</svg>
